concentration:
  note: >-
    Derived from the governance seats captured in people/camara-project-people.yml. Useful as a read on
    who actually steers the standard, not just who participates in it.
  deutsche_telekom: 'Chair of the Governing Board, Technical Lead, Outreach Committee, and TSC chair'
  observed: >-
    Deutsche Telekom holds the Governing Board chair, the Board Technical Lead seat, the Outreach
    Committee seat and the TSC chair. Vodafone and Orange hold the two TSC deputy chairs. Verizon holds
    the Board treasurer seat. The standard is steered by European incumbent operators, with US carriers
    on the board and the aggregator layer (Aduna, Nokia, Ericsson) present but not chairing.
