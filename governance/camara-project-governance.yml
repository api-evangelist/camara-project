launched: MWC 2022
note: >-
  CAMARA separates the technical project from the money. The Technical Steering Committee governs the
  specifications and is elected from active maintainers; the Governing Board manages the Directed Fund,
  the budget and outreach. That split is deliberate and is the reason a company can contribute
  technically without buying a board seat — and, read the other way, why board seats concentrate among
  the operators who fund it.

