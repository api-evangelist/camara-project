api_lifecycle:
  stages:
  - Sandbox
  - Incubating
  - Graduated
  - Archived
  source: https://github.com/camaraproject/Governance/blob/main/documentation/API-Onboarding-and-Lifecycle.md
  definition: >-
    All new APIs begin in a Sandbox repository and evolve through Sandbox → Incubating → Graduated
    (→ Archived). Sandbox is the entry point for experimentation with no strict requirements. Moving to
    Incubating requires maintainers to apply via an issue in the API Backlog working group, which
    pre-checks on behalf of the TSC, which then confirms inclusion in an existing or new Sub Project.
  onboarding: >-
    New API proposals are submitted and evaluated by the API Backlog working group codeowners, who bring
    agreed proposals to the TSC. Approved proposals get a dedicated Sandbox repository derived from
    Template_API_Repository, a mailing list, and assigned maintainership.
  frozen_proposals: >-
    Proposals approved by the TSC with no onboarding progress can be frozen, and frozen proposals can be
    reactivated or archived.
  observed:
    method: derived from repository descriptions in the GitHub org, 2026-07-30
    sandbox: 57
    incubating: 15
    graduated: 0
    archived_flag_set: 1
    finding: >-
      No repository in the organization describes itself as Graduated. The flagship APIs the industry
      markets — Number Verification, SIM Swap, Quality on Demand, Device Location — are all still
      Incubating, four years after the project was founded. Read carefully: maturity here is taken from
      each repository's own description, which is CAMARA's stated convention but may lag an actual
      graduation decision. Worth confirming against TSC minutes before publishing as fact.

