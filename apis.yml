position: Producing
description: CAMARA is the Telco Global API Alliance — an open-source project hosted by the Linux Foundation
  that defines, builds, and tests a unified set of network APIs across the world's mobile operators. Working
  alongside the GSMA Open Gateway commercialization initiative, CAMARA produces operator-neutral OpenAPI
  3.0 specifications for 60+ telco network capabilities including Number Verification, SIM Swap, Device
  Location, Quality on Demand, KYC, Carrier Billing, Edge Discovery, Device Status, SMS, and more — all
  published under Apache 2.0. The project is organized into Sandbox, Incubating, and Graduated sub-projects
  with cross-cutting Commonalities, Identity and Consent Management, and Release Management working groups.
  Major contributors include Deutsche Telekom, Orange, Telefonica, Vodafone, T-Mobile, Verizon, AT&T,
  KDDI, SK Telecom, China Mobile, and dozens of other operators and vendors.
